# Se copia a ~/servicios/compra/ en el VPS. Sin `ports:` a propósito: solo se accede por el túnel de Cloudflare.
services:
  compra:
    image: compra-en-familia:0.5.0
    container_name: compra
    restart: unless-stopped
    # Docker del VPS es rootless: el root del contenedor es el usuario `joseluis` del host (sin privilegios
    # reales) y es el único que puede escribir en ./data. `node` (uid 1000) se mapea a un uid ajeno.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    env_file: .env
    volumes:
      - ./data:/app/data
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [proxy]

networks:
  proxy:
    external: true
